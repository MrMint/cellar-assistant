"""
Where the match run is — the half of the pipeline `processingStatus` does not describe, since a scan is `completed` as soon as extraction finishes. `waiting` (extracting) → `queued` → `running` → `completed` | `failed`; `skipped` when there is nothing to match. Derived from the match job and the outbox on every read (N06a). Poll until it is `completed`, `failed` or `skipped`.
"""
enum MenuScanMatchStatus {
  completed
  failed
  queued
  running
  skipped
  waiting
}

