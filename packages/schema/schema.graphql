  Ask another user to be friends. Rejected for yourself (Validation), an existing friend, or a request already open either way (Conflict). All four carry an `ActorError.reason` — CANNOT_FRIEND_SELF, ALREADY_FRIENDS, FRIEND_REQUEST_ALREADY_SENT or FRIEND_REQUEST_ALREADY_RECEIVED — because the three Conflicts share one `code`. Switch on `reason`; never match on `message`.
  """
  sendFriendRequest(userId: ID!): SendFriendRequestResult!

  """Admin only (BrandActor.setParent). Pass null to clear the parent."""
  setBrandParent(id: ID!, parentBrandId: ID): SetBrandParentResult!
  setCellarItemPercentage(cellarId: ID!, cellarItemId: ID!, percentageRemaining: Float!): SetCellarItemPercentageResult!

  """
  Replaces the recipe's complete ingredient list in one transaction. An ingredient naming a `newGenericItem` is find-or-created through `ItemActor`, the single writer of `generic_items`.
  """
  setRecipeIngredients(
    """The full list. An empty array clears it."""
    ingredients: [RecipeIngredientInput!]!
    recipeId: ID!
  ): SetRecipeIngredientsResult!

  """
  Replaces the recipe's complete instruction list in one transaction. Steps are numbered 1..n from the order you send.
  """
  setRecipeInstructions(instructions: [RecipeInstructionInput!]!, recipeId: ID!): SetRecipeInstructionsResult!

  """
  Creates the onboarding and runs the label extraction. **Slow by design** — the model call happens inside this actor's turn (§8.5), which is why onboarding has an actor of its own. Idempotent: a retry after a completed extraction returns the stored defaults without calling the model again.
