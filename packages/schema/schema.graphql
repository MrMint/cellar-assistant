  updateBrand(id: ID!, input: UpdateBrandInput!): UpdateBrandResult!

  """Renames, re-privacies and re-owners a cellar in one transaction."""
  updateCellar(cellarId: ID!, input: UpdateCellarInput!): UpdateCellarResult!
  updateCellarItem(cellarId: ID!, cellarItemId: ID!, input: UpdateCellarItemInput!): UpdateCellarItemResult!

  """The creator's alone; an ownerless row is admin-only."""
  updateGenericItem(genericItemId: ID!, input: UpdateGenericItemInput!): UpdateGenericItemResult!

  """Creator only. Enrichment updates arrive as `system` instead."""
  updateItem(input: UpdateItemInput!, itemId: ID!, type: ItemType!): UpdateItemResult!

  """The author's alone."""
  updateItemReview(input: UpdateItemReviewInput!, itemId: ID!, reviewId: ID!, type: ItemType!): UpdateItemReviewResult!

  """Change the viewer's own profile (proxied to better-auth)."""
  updateProfile(input: UpdateProfileInput!): UpdateProfileResult!

  """Creator only."""
  updateRecipe(input: UpdateRecipeInput!, recipeId: ID!): UpdateRecipeResult!

  """Creator only."""
  updateRecipeGroup(input: UpdateRecipeGroupInput!, recipeGroupId: ID!): UpdateRecipeGroupResult!

  """Author only — not the recipe's creator, not an admin's peer."""
  updateRecipeReview(input: UpdateRecipeReviewInput!, recipeId: ID!, reviewId: ID!): UpdateRecipeReviewResult!

  """Header fields only — name, description, privacy, lock. Creator only."""
  updateTierList(input: UpdateTierListInput!, tierListId: ID!): UpdateTierListResult!

  """
  Confirms or rejects an AI menu-item match. **Scan owner only** — the same principal `actOnMenuScanSuggestion` requires, since that mutation's acceptance is delivered here. `match: null` clears it — a rejection is a verification and is stamped as one.
