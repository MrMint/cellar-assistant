  Read a recipe off a photo. Returns as soon as the job is accepted — the five stages run on the outbox after that, so poll `recipePhotoJob(jobId:)` and read `progress.recipeId` when `progress.done` is true. Idempotent on `jobId`: re-sending the same id returns the running job and never starts a second chain or asks the model twice.
