"""
Where to PUT the bytes. The client uploads to `uploadUrl` directly — the API never sees the image, and neither does the Dapr sidecar.
"""
type UploadTarget {
  bucket: String!

  """15 minutes out. Mint a new target rather than retrying."""
  expiresAt: DateTime!

  """
  Address `FileActor` with this, and pass it to `attachItemImage`, `createMenuScan` or `startItemOnboarding` once the PUT succeeds.
  """
  fileId: ID!
  key: String!

  """
  A presigned PUT. Send the raw bytes as the body with the same `Content-Type` you declared; add no other headers, or the signature will not match.
  """
  uploadUrl: String!
}

"""
A user, as any signed-in viewer may see them. Profile fields live in better-auth's `user` table; there is no `public.users` (plan §3).
"""
type UserProfile {
  avatarUrl: String
  displayName: String!

  """
  Only ever populated for the owner (or an admin); null for everybody else, including friends.
  """
  email: String
  id: ID!
  locale: String
}

type UserProfileConnection {
  edges: [UserProfileEdge!]!
  pageInfo: PageInfo!

  """Total rows matching the query, or null when counting is not cheap."""
  totalCount: Int
}

type UserProfileEdge {
  cursor: String!
  node: UserProfile!
}

type UserSearchConnection {
  edges: [UserSearchEdge!]!
  pageInfo: PageInfo!

  """Total rows matching the query, or null when counting is not cheap."""
  totalCount: Int
}

type UserSearchEdge {
  cursor: String!
  node: UserSearchResult!
}

"""
Someone the viewer could send a friend request to. The viewer, their friends, and anyone with a request open in either direction are never in this list.
"""
type UserSearchResult {
  avatarUrl: String
  displayName: String!
  userId: ID!
}

"""Input the actor rejected before touching the database."""
type ValidationError implements ActorError & Error {
  """
  What kind of refusal this is. Branch on `reason` first when it is set, then on this; never on `message`.
  """
  code: ActorErrorCode!
  message: String!

  """
  Machine-readable discriminator within `code`, or null when `code` says everything there is to say. Switch on this, never on `message`.
  """
  reason: ActorErrorReason
}

union VerifyMenuItemMatchResult = BudgetExceededError | ConflictError | ForbiddenError | NotFoundError | PlaceMenuItem | ValidationError

union VerifyUploadResult = BudgetExceededError | ConflictError | File | ForbiddenError | NotFoundError | ValidationError

"""The signed-in user, as their token describes them."""
type Viewer {
  """
  The /search landing line. Counts only cellars you created or co-own — `myCellars` also lists other people's visible cellars, so summing it over-counts (UI parity G36).
  """
  collectionStats: CollectionStats!
  email: String
  emailVerified: Boolean!

  """The viewer's favourited items (/favorites)."""
  favorites(
    """
    An `edge.cursor` from a previous page. Opaque and owned by the actor that minted it: cursors are not interchangeable between fields.
    """
    after: String

    """**Not supported.** See `last`. Paging is forward-only."""
    before: String

    """
    How many edges to return, 1 to 100 inclusive; defaults to 20. Over the cap is a `VALIDATION` error, not a silent clamp.
    """
    first: Int

    """
    **Not supported.** Present because the Relay spec puts it here; passing it is a `VALIDATION` error rather than a silently forward page. Paging is forward-only — use `first`/`after`.
    """
    last: Int

    """
    Only these item types (UI parity G25); omitted or empty means all six. Filters before paging, so `totalCount` follows it.
    """
    types: [ItemType!]
  ): ItemConnection!
  id: ID!

  """The viewer's own profile row, including their email."""
  profile: UserProfile!
  role: ViewerRole!
}

"""
A6 collapses the `role` column to exactly these two in the token. `system` (plan §8.2) has no representation here by design: no request can ever act as the system.
"""
enum ViewerRole {
  ADMIN
  USER
}

"""
Filters against the *viewer's* `user_place_interactions`. There is no argument for whose visits to read; it is always the viewer's.
"""
enum VisitStatusFilter {
  UNVISITED
  VISITED
}

union VoteOnRecipeResult = BudgetExceededError | ConflictError | ForbiddenError | NotFoundError | RecipeVotePayload | ValidationError

