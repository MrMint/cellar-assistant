  """
  Point an item at a code. The item's creator only — this is the write today's empty-filter `barcodes` update permission lets anybody make.
  """
  linkBarcodeItem(code: String!, itemId: ID!, itemType: ItemType!): LinkBarcodeItemResult!

  """
  The item creator's alone (today's `item_brands` insert check). `brandId` comes from `resolveBrand`, never from a client-invented id.
  """
  linkItemBrand(brandId: ID!, isPrimary: Boolean, itemId: ID!, type: ItemType!): LinkItemBrandResult!

  """
  Idempotent on (place, brand): a repeat link with a different relationship updates it rather than conflicting.
  """
  linkPlaceBrand(input: LinkPlaceBrandInput!, placeId: ID!): LinkPlaceBrandResult!

  """Idempotent: an already-open bottle keeps its `openAt`."""
  openCellarItem(cellarId: ID!, cellarItemId: ID!): OpenCellarItemResult!

  """
  The `<Command>Result` template (§8.3): the payload, or one of the five typed errors.
  """
  ping(actorId: String, message: String): PingResult!

  """
  Bumps the place's own visit counters. `user_place_interactions` is UserActor's table and is not touched here (§1.2, single writer).
  """
  recordPlaceAccess(placeId: ID!): RecordPlaceAccessResult!

  """
  Save, visit or rate a place. The visit count is recomputed by the actor; there is no way to set it.
  """
  recordPlaceInteraction(input: RecordPlaceInteractionInput!): RecordPlaceInteractionResult!

  """
  Decline a request sent to you, or cancel one you sent. Both are the same row; only the requester's actor may delete it.
  """
  rejectFriendRequest(requestId: ID!): RejectFriendRequestResult!

  """
  Unfriend someone. **Both** `friends` rows are gone before this answers, so the viewer's next read already shows the removal (E2d: `myFriends` used to keep listing them for ~2s after this succeeded). The outbox row that follows only reloads the other person's actor.
  """
  removeFriend(userId: ID!): RemoveFriendResult!

  """Removes the bottle and the check-ins that point at it."""
  removeItemFromCellar(cellarId: ID!, cellarItemId: ID!): RemoveItemFromCellarResult!

  """
  Withdraws **your own** vote. There is no argument by which another user's vote could be named.
  """
  removeRecipeVote(recipeGroupId: ID!, recipeId: ID!): RemoveRecipeVoteResult!

  """Removes the entry and renumbers the rest of its band."""
  removeTierListItem(tierListId: ID!, tierListItemId: ID!): RemoveTierListItemResult!

  """
  orderedIds is the complete post-reorder membership of `band`, in order. An id not currently in `band` is moved into it — a cross-band drag is one call, and the band it moved out of is renumbered too, in the same transaction.
