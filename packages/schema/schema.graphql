  """Admin only (BrandActor.setParent). Pass null to clear the parent."""
  setBrandParent(id: ID!, parentBrandId: ID): SetBrandParentResult!

  """
  ux-c L08: save your own steep or brew numbers for a tea or coffee — all four at once, replacing what you had; all four null goes back to typical. An item that does not exist answers NOT_FOUND.
  """
  setBrewPrefs(
    """Grams, > 0. Null or absent: typical."""
    doseGrams: Float
    itemId: ID!
    itemType: ItemType!

    """Seconds, > 0. Null or absent: typical."""
    steepSeconds: Int

    """Millilitres, > 0. Null or absent: typical."""
    waterMl: Float

    """°C, 1–100. Null or absent: typical."""
    waterTempC: Int
  ): SetBrewPrefsResult!
  setCellarItemPercentage(cellarId: ID!, cellarItemId: ID!, percentageRemaining: Float!): SetCellarItemPercentageResult!

  """
  Who else was there, after the fact: the complete set of friends who drank with you (not a change list). Only on your own entry of a drink you logged. A friend added gets an entry of their own in the same occasion; one left out loses the entry you wrote for them — unless they have added to it, which is a `ConflictError`.
  """
  setDrinkLogCompanions(companionIds: [ID!]!, id: ID!): SetDrinkLogCompanionsResult!

  """
  Put one item in the viewer's favourites, or take it out. Idempotent: asking for the current state changes nothing, so a retried request cannot flip it back (it replaced the flipping `toggleFavorite`).
