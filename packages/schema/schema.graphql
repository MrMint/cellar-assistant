  setRecipeInstructions(instructions: [RecipeInstructionInput!]!, recipeId: ID!): SetRecipeInstructionsResult!

  """
  D9: Love a recipe (`loved: true`), or take the Love back. Idempotent: asking for the current state changes nothing, so a retried request cannot flip it back (it replaced the flipping `toggleRecipeLove`).
  """
  setRecipeLove(loved: Boolean!, recipeId: ID!): SetRecipeLoveResult!

  """
  Put an item, recipe or place on the viewer's Want to try list, or take it off. Idempotent: asking for the current state changes nothing.
