How a scan's filed lines stand, counted by the server so a menu longer than one page still gets an honest headline. Every line is in exactly one bucket: `matched`, `toConfirm`, or new (`lines - matched - toConfirm`).
"""
type MenuScanMatchCounts {
  """Menu lines filed on the place for this scan."""
  lines: Int!

  """
  Confirmed lines: a verified item, a linked recipe, or an accepted suggestion. An AI suggestion nobody has accepted is not counted.
  """
  matched: Int!

  """
  Unconfirmed lines with at least one suggestion awaiting Accept / Reject.
  """
  toConfirm: Int!
