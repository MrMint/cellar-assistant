  """
  verifyUpload(fileId: ID!): VerifyUploadResult!

  """
  Any signed-in user, on a recipe in this group. Voting again replaces your vote; the canonical recipe is recomputed in the same turn.
  """
  voteOnRecipe(recipeGroupId: ID!, recipeId: ID!, voteType: RecipeVoteType!): VoteOnRecipeResult!
}

