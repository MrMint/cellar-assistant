    jobId: ID
  ): StartRecipePhotoJobResult!

  """
  X15: read a recipe out of pasted text. The same job, stages and polling as `startRecipePhotoJob` (`recipePhotoJob(jobId:)`); the result is a private draft for its author to review. Idempotent on `jobId`.
