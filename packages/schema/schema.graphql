  """
  matchCounts: MenuScanMatchCounts!
  matchStatus: MenuScanMatchStatus!

  """
  Every line this scan extracted, matched or not — `suggestions` reaches only the lines that got a suggestion. By menu category (uncategorised last), then name, so the scan page can group them. Yours alone, as the scan is. Paged; `totalCount` exact.
