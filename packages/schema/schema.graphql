  requestTierListInsights(tierListId: ID!): RequestTierListInsightsResult!

  """
  X19 “Re-read label”: the item's stored label photographs, read again by the vision model. The creator only. **Slow** (the model runs in the request, as `startItemOnboarding`'s does) and **writes nothing**.
