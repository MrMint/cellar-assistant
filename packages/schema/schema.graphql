  startRecipeTextJob(input: StartRecipeTextJobInput!, jobId: ID): StartRecipeTextJobResult!

  """
  Flavour words from a typed note, for the drinker to confirm. Returns only words the note contains; abstains when it names no flavour. Writes nothing. A model call (`ai_model/flavour_tags`).
