  createTierList(input: CreateTierListInput!): CreateTierListResult!

  """
  Step 1 of an upload. Mints the `files` row and a presigned PUT URL. **Not idempotent, on purpose**: a second call on the same `fileId` is a `ConflictError` rather than a second, different URL for one row.
  """
  createUploadTarget(
    """
    Mint it client-side to control the id you will reference later; omitted, the server mints one and returns it.
    """
    fileId: ID
    input: CreateUploadTargetInput!
  ): CreateUploadTargetResult!

  """The creator's alone. `ConflictError` if the cellar still holds items."""
  deleteCellar(cellarId: ID!): DeleteCellarResult!

  """
  Uploader only. Removes the row, then best-effort removes the object — the row is the truth (§1.3), so an orphaned object is inert. Detach the image first; the foreign key from `item_image` is `RESTRICT`.
  """
  deleteFile(fileId: ID!): DeleteFileResult!

  """The author's alone."""
  deleteItemReview(itemId: ID!, reviewId: ID!, type: ItemType!): DeleteItemReviewResult!

  """
  Creator only. Cascades its ingredients, instructions, reviews, votes and vector in one statement. If it was its group's canonical version, the group picks a new one asynchronously (an outbox row, not part of this call), so a read immediately after may still see the old `canonicalRecipeId`.
  """
  deleteRecipe(recipeId: ID!): DeleteRecipeResult!

  """
  Creator only, and **only while the group is empty**. `recipes.recipe_group_id` is `ON DELETE SET NULL`, so deleting a group with versions in it would orphan them rather than remove them — a `ConflictError` says so instead. Delete or re-group the versions first (`deleteRecipe`).
  """
  deleteRecipeGroup(recipeGroupId: ID!): DeleteRecipeGroupResult!

  """Author only."""
  deleteRecipeReview(recipeId: ID!, reviewId: ID!): DeleteRecipeReviewResult!

  """Creator only. Cascades its items in one statement."""
  deleteTierList(tierListId: ID!): DeleteTierListResult!

  """The uploader's alone."""
  detachItemImage(imageId: ID!, itemId: ID!, type: ItemType!): DetachItemImageResult!

  """Idempotent, and implies open."""
  emptyCellarItem(cellarId: ID!, cellarItemId: ID!): EmptyCellarItemResult!

  """
  Queues an enrichment. Returns QUEUED immediately — the details fetch and up to `maxPhotos` downloads are eight external round-trips and run on the outbox, charged through BudgetActor. Returns FRESH instead, queueing nothing and spending nothing, when the place's Google details are under 30 days old.
  """
  enrichPlaceFromGoogle(input: EnrichPlaceInput, placeId: ID!): EnrichPlaceFromGoogleResult!

  """
  Find-or-create. Naturally idempotent on the primary key. Changing the `type` of a code that already has one is admin-only (§2.1: 'only on creation or admin').
  """
  ensureBarcode(code: String!, type: String): EnsureBarcodeResult!

  """
  The stored proposal, without re-running the model. A mutation only because §8.3 keeps the command vocabulary on `Mutation`; it writes nothing.
  """
