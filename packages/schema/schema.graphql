  Confirms or rejects an AI menu-item match. **Scan owner only** — the same principal `actOnMenuScanSuggestion` requires, since that mutation's acceptance is delivered here. `match: null` clears it — a rejection is a verification and is stamped as one.
  """
  verifyMenuItemMatch(match: MenuItemMatchInput, menuItemId: ID!, placeId: ID!): VerifyMenuItemMatchResult!

  """
  Step 3. Asks the object store whether the object is actually there — the client's word is never taken for it. Idempotent: a second call on a verified file is a read. `ConflictError` means the PUT has not landed. `attachItemImage` calls this for you; use it directly when the upload and the attach are separated in time.
  """
  verifyUpload(fileId: ID!): VerifyUploadResult!

  """
  Any signed-in user, on a recipe in this group. Voting again replaces your vote; the canonical recipe is recomputed in the same turn.
  """
  voteOnRecipe(recipeGroupId: ID!, recipeId: ID!, voteType: RecipeVoteType!): VoteOnRecipeResult!
}

type MutationCreateItemSuccess {
  data: Item!
}

type MutationUpdateItemSuccess {
  data: Item!
}

"""
F-94: your friends who are also someone's friends — the locked profile's "Friend of …". Only ever people already on your own list.
"""
type MutualFriends {
  count: Int!

  """The first of them by name; null with none."""
  first: UserProfile
}

"""A place near the point you asked about, and how far it is."""
type NearbyPlace {
  """Great-circle distance from the point, in metres."""
  distanceMeters: Float!

  """
  The place, through `PlaceActor.get` — one call per place on the page. The strip's summary fields (`priceLevel`, `enrichment`, `photos`) are each one more `PlaceActor` call per place.
  """
  place: Place!
}

type NearbyPlaceConnection {
  edges: [NearbyPlaceEdge!]!
  pageInfo: PageInfo!

  """Total rows matching the query, or null when counting is not cheap."""
  totalCount: Int
}

type NearbyPlaceEdge {
  cursor: String!
  node: NearbyPlace!
}

"""
Find-or-create a `generic_items` row by (name, category). The row is created by `ItemActor`, its single writer — never by the recipe.
"""
input NewGenericIngredientInput {
  category: String!
  description: String
  isSubstitutable: Boolean
  kind: GenericItemKind!
  name: String!
  subcategory: String
}

"""The row does not exist, or the viewer may not learn that it does."""
type NotFoundError implements ActorError & Error {
  """
  What kind of refusal this is. Branch on `reason` first when it is set, then on this; never on `message`.
  """
  code: ActorErrorCode!
  message: String!

  """
  Machine-readable discriminator within `code`, or null when `code` says everything there is to say. Switch on this, never on `message`.
  """
  reason: ActorErrorReason

  """
  When asking again can first succeed (a per-user window freeing a slot, or the month turning), or null when no time clears it.
  """
  retryAt: DateTime
}

"""
`item_onboardings.status`. Plain `text` in the database with no check constraint, so this enum is the convention rather than an enforced domain. `START` is the column default; `COMPLETED` is what the old `getItemDefaults` wrote; `CONFIRMED` and `FAILED` are B2 additions for two states the old flow had nowhere to record. `MATCHED` closes a session whose bottle was an item the catalogue already held (`closeItemOnboarding`): nothing was created from it.
"""
enum OnboardingStatus {
  COMPLETED
  CONFIRMED
  FAILED
  MATCHED
  NEEDS_DETAILS
  START
}

union OpenCellarItemResult = BudgetExceededError | CellarItem | ConflictError | ForbiddenError | NotFoundError | ValidationError

union OpenItemDraftResult = BudgetExceededError | ConflictError | ForbiddenError | ItemOnboarding | NotFoundError | ValidationError

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

"""The `permission_type` Postgres enum (`cellars`/`tier_lists` privacy)."""
enum PermissionType {
  FRIENDS
  PRIVATE
  PUBLIC
}

"""
How a person in a search answer is connected to the viewer (X12): a friend, someone whose request is waiting on the viewer, someone the viewer has asked, or nobody yet.
"""
enum PersonRelation {
  FRIEND
  NONE
  REQUEST_RECEIVED
  REQUEST_SENT
}

union PingResult = BudgetExceededError | ConflictError | ForbiddenError | NotFoundError | Pong | ValidationError

"""
A place, by id. There is no `PlaceActor` yet (plan workstream B5), so there is nothing here to resolve further fields through — extend this type when B5 lands rather than declaring a new one.
"""
type Place {
  accessCount: Int!
  brands(
    """
    An `edge.cursor` from a previous page. Opaque and owned by the actor that minted it: cursors are not interchangeable between fields.
    """
    after: String

    """**Not supported.** See `last`. Paging is forward-only."""
    before: String

    """
    How many edges to return, 1 to 100 inclusive; defaults to 20. Over the cap is a `VALIDATION` error, not a silent clamp.
    """
    first: Int

    """
    **Not supported.** Present because the Relay spec puts it here; passing it is a `VALIDATION` error rather than a silently forward page. Paging is forward-only — use `first`/`after`.
    """
    last: Int
  ): PlaceBrandConnection!
  categories: [String!]!

  """
  0..1. Set by `PlaceCreationActor` from the AI review; a caller may never choose its own.
  """
  confidence: Float
  countryCode: String
  createdAt: DateTime
  createdById: ID
  description: String
  displayName: String
  email: String

  """Null until this place has been enriched from Google."""
