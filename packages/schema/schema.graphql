  undoTierListEdit(
    """The `seq` of the edit to take back."""
    expectedSeq: Int!
    tierListId: ID!
  ): UndoTierListEditResult!

  """
  The item creator's alone. Idempotent: a brand that is not linked — never was, or an earlier call already unlinked it — answers the same `UnlinkedItemBrand`, so a retried clear succeeds instead of NotFound.
  """
  unlinkItemBrand(brandId: ID!, itemId: ID!, type: ItemType!): UnlinkItemBrandResult!

  """Admin only (BrandActor.update)."""
  updateBrand(id: ID!, input: UpdateBrandInput!): UpdateBrandResult!

  """Renames, re-privacies and re-owners a cellar in one transaction."""
  updateCellar(cellarId: ID!, input: UpdateCellarInput!): UpdateCellarResult!
  updateCellarItem(cellarId: ID!, cellarItemId: ID!, input: UpdateCellarItemInput!): UpdateCellarItemResult!

  """Change your own entry. Only the drinker may."""
  updateDrinkLog(id: ID!, input: UpdateDrinkLogInput!): UpdateDrinkLogResult!

  """The creator's alone; an ownerless row is admin-only."""
  updateGenericItem(genericItemId: ID!, input: UpdateGenericItemInput!): UpdateGenericItemResult!

  """Creator only. Enrichment updates arrive as `system` instead."""
