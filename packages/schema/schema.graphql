  suggestItemDetails(input: SuggestItemDetailsInput!, itemId: ID!, type: ItemType!): SuggestItemDetailsResult!

  """
  X07 “Add to catalog”: the `suggestItemDetails` pass for a draft that is not an item yet — a menu line nobody has filed. Any signed-in viewer; `draftId` is minted by the client (an id that names someone else's onboarding is not found). May abstain; writes nothing — the draft becomes an item only through `openItemDraft` then `confirmItemOnboarding`, on the person's tap.
  """
  suggestNewItemDetails(draftId: ID!, input: SuggestItemDetailsInput!, type: ItemType!): SuggestNewItemDetailsResult!

  """
  D4: takes back the latest edit not already undone (an add, a removal, a move) and records that in the list's append-only history. Creator only. `expectedSeq` is the `editHistory.undo.seq` the caller showed: if anything else is on top (the list changed in another tab, or there is nothing left to undo) it is a `ConflictError` with reason TIER_LIST_HISTORY_MOVED and nothing is written.
