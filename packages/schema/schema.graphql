  D4: puts back the latest undone edit. A new edit after an undo clears what Redo can put back. Creator only. `expectedSeq` is the `editHistory.redo.seq` the caller showed; anything else on top is a `ConflictError` with reason TIER_LIST_HISTORY_MOVED, and no write.
