`menu_scans.processing_status`, enforced by its check constraint. `pending` → `processing` → `completed` | `failed`; the transitions are made by `MenuScanActor.process`, never by a client.
"""
enum MenuScanStatus {
  completed
  failed
  pending
  processing
}

type Mutation {
  """
  Become friends with the person whose link this is. Idempotent. Writes your `friends` row now; theirs follows through the outbox.
  """
  acceptFriendInvite(token: String!): AcceptFriendInviteResult!

  """
  Accept a request addressed to you. Writes the viewer's own `friends` row; the requester's row follows through the outbox (§1.7).
  """
  acceptFriendRequest(requestId: ID!): AcceptFriendRequestResult!

  """
  Confirm one of the review's suggestions on a place you added: a suggested category is added to `categories`; the suggested description becomes `description` (only when there is none). The suggestion is used up either way.
  """
  acceptPlaceSuggestion(input: AcceptPlaceSuggestionInput!, placeId: ID!): AcceptPlaceSuggestionResult!

  """
  Accept or reject one AI match. Scan owner only. Accepting an item also queues `PlaceActor.verifyMenuItemMatch`, and accepting a recipe `PlaceActor.linkMenuItemRecipe`, so the place's menu learns what the line is (§1.7).
  """
  actOnMenuScanSuggestion(
    input: MatchSuggestionActionInput!

    """
    §2.1: `/discoveries` acts by suggestion id, so the projection carries `menuScanId` for the resolver to route with.
    """
    menuScanId: ID!
  ): ActOnMenuScanSuggestionResult!
  addItemReview(input: AddItemReviewInput!, itemId: ID!, type: ItemType!): AddItemReviewResult!
  addItemToCellar(cellarId: ID!, input: AddCellarItemInput!): AddItemToCellarResult!

  """
  Any signed-in user, at most one review per recipe. Reviewing again is a `ConflictError` — use `updateRecipeReview`.
  """
  addRecipeReview(input: AddRecipeReviewInput!, recipeId: ID!): AddRecipeReviewResult!

  """
  Appends to the end of the given band (position computed in-turn, no read-modify-write race), or with `position` inserts there (M7). Refuses a duplicate entry.
  """
  addTierListItem(input: AddTierListItemInput!, tierListId: ID!): AddTierListItemResult!

  """
  X16's multi-add: several entries in one transaction and one history edit, so one Undo takes them all back. Entries already on the list, named twice or unreadable are skipped and counted, not refused.
  """
  addTierListItems(input: AddTierListItemsInput!, tierListId: ID!): AddTierListItemsResult!

  """
  Any signed-in viewer may add an image. The file is verified through `FileActor` first — an upload that never landed is refused.
  """
  attachItemImage(input: AttachItemImageInput!, itemId: ID!, type: ItemType!): AttachItemImageResult!

  """
  Records the drink for you and your friends at the table. Every id must be you or a friend of yours; one that is not rejects the call. The rows share one occasion, so each entry says who else was there.
  """
  bulkCheckIn(cellarId: ID!, cellarItemId: ID!, userIds: [ID!]!): BulkCheckInResult!

  """
  Ask a running job to stop. Checked at the top of the next batch, so a stage already in flight finishes and nothing is torn down mid-write. Cancelling a finished job is a no-op, not an error.
  """
  cancelRecipePhotoJob(jobId: ID!): CancelRecipePhotoJobResult!

  """
  Records that you drank from this bottle. Requires the cellar to be visible to you. The quick form of `logDrink`.
  """
  checkIn(
    cellarId: ID!
    cellarItemId: ID!

    """Mint it yourself to make the call idempotent (§8.4)."""
    checkInId: ID
  ): CheckInResult!

  """
  L03: copies a tier list you may see into a new PRIVATE list of yours — the entries in band and order, not the notes. A list you may not see answers NotFound, like a missing one. Undo is `deleteTierList` on the copy.
  """
  cloneTierList(name: String, sourceTierListId: ID!): CloneTierListResult!

  """
  Closes a session whose bottle turned out to be an item the catalogue already held (the quick-add, or “Is it this one? +1 bottle”): its status becomes `MATCHED` and nothing is created. Idempotent; a session that already `CONFIRMED` an item of its own stays `CONFIRMED`.
  """
  closeItemOnboarding(onboardingId: ID!): CloseItemOnboardingResult!

  """
  Turns an accepted proposal into an item, a brand link and a cellar item. Delivered twice, it yields one of each (§8.4).
  """
  confirmItemOnboarding(input: ConfirmItemOnboardingInput!, onboardingId: ID!): ConfirmItemOnboardingResult!

  """
  Creates a cellar. The id is minted here and the actor addressed by it before any row exists — the provisional-id pattern every `create` uses.
  """
  createCellar(input: CreateCellarInput!): CreateCellarResult!
  createGenericItem(genericItemId: ID, input: CreateGenericItemInput!): CreateGenericItemResult!

  """
  Mints the id and addresses `ItemActor(type:id)` before any row exists — the provisional-id pattern every `create` uses. Pass `itemId` yourself to make the call idempotent (§8.4).
  """
  createItem(input: CreateItemInput!, itemId: ID, type: ItemType!): CreateItemResult!

  """
  Records the upload and queues its extraction in the same transaction (§1.4). Returns immediately with `processingStatus: pending`; the extraction, the menu filing and the match run are three outbox rows. Idempotent on `menuScanId`: pass your own to make a retry free.
  """
  createMenuScan(input: CreateMenuScanInput!, menuScanId: ID): CreateMenuScanResult!

  """
  Rate limit, duplicate check, then PlaceActor.create — one submission at a time per user (PlaceCreationActor, keyed by the viewer), with the duplicate check re-run under database locks inside PlaceActor.create. The place is saved at once as PENDING — on its creator's map with 'Under review', on nobody else's — and the AI review runs afterwards, from the outbox (X27 / D28). The only place-creation path a client has; there is deliberately no mutation that reaches PlaceActor.create directly.
  """
  createPlace(input: CreatePlaceInput!): CreatePlaceResult!

  """
  Mints the id and addresses `RecipeActor(id)` before any row exists — the provisional-id pattern every `create` uses.
  """
  createRecipe(input: CreateRecipeInput!): CreateRecipeResult!
  createRecipeGroup(input: CreateRecipeGroupInput!): CreateRecipeGroupResult!

  """
  Creates a tier list. The id is minted here and the actor addressed by it before any row exists — the provisional-id pattern every `create` uses.
  """
  createTierList(input: CreateTierListInput!): CreateTierListResult!

  """
  Step 1 of an upload. Mints the `files` row and a presigned PUT URL. **Not idempotent, on purpose**: a second call on the same `fileId` is a `ConflictError` rather than a second, different URL for one row.
  """
  createUploadTarget(
    """
    Mint it client-side to control the id you will reference later; omitted, the server mints one and returns it.
    """
    fileId: ID
    input: CreateUploadTargetInput!
  ): CreateUploadTargetResult!

  """The creator's alone. `ConflictError` if the cellar still holds items."""
  deleteCellar(cellarId: ID!): DeleteCellarResult!

  """
  Remove an entry about you, or one you wrote that its drinker has not added to. Removing the entry you logged for a table removes the companions' entries you wrote with it (Undo) — except any a friend has since scored, noted, tagged or photographed, which are theirs.
  """
  deleteDrinkLog(id: ID!): DeleteDrinkLogResult!

  """
  Uploader only. Removes the row, then best-effort removes the object — the row is the truth (§1.3), so an orphaned object is inert. Detach the image first; the foreign key from `item_image` is `RESTRICT`.
  """
  deleteFile(fileId: ID!): DeleteFileResult!

  """The author's alone."""
  deleteItemReview(itemId: ID!, reviewId: ID!, type: ItemType!): DeleteItemReviewResult!

  """
  Delete a PENDING or REJECTED place you added. A shared place cannot be deleted, nor one a tier list or menu scan still points at (Conflict, naming which).
  """
  deletePlace(placeId: ID!): DeletePlaceResult!

  """
  Creator only. Cascades its ingredients, instructions, reviews, votes and vector in one statement. If it was its group's canonical version, the group picks a new one asynchronously (an outbox row, not part of this call), so a read immediately after may still see the old `canonicalRecipeId`.
  """
  deleteRecipe(recipeId: ID!): DeleteRecipeResult!

  """
  Creator only, and **only while the group is empty**. `recipes.recipe_group_id` is `ON DELETE SET NULL`, so deleting a group with versions in it would orphan them rather than remove them — a `ConflictError` says so instead. Delete or re-group the versions first (`deleteRecipe`).
  """
  deleteRecipeGroup(recipeGroupId: ID!): DeleteRecipeGroupResult!

  """Author only."""
  deleteRecipeReview(recipeId: ID!, reviewId: ID!): DeleteRecipeReviewResult!

  """Creator only. Cascades its items in one statement."""
  deleteTierList(tierListId: ID!): DeleteTierListResult!

  """The uploader's alone."""
  detachItemImage(imageId: ID!, itemId: ID!, type: ItemType!): DetachItemImageResult!

  """
  Dismiss every remaining review suggestion on a place you added. Idempotent.
  """
  dismissPlaceSuggestions(placeId: ID!): DismissPlaceSuggestionsResult!

  """Idempotent, and implies open."""
  emptyCellarItem(cellarId: ID!, cellarItemId: ID!): EmptyCellarItemResult!

  """
  Queues an enrichment. Returns QUEUED immediately — the details fetch and up to `maxPhotos` downloads are eight external round-trips and run on the outbox, charged through BudgetActor. Returns FRESH instead, queueing nothing and spending nothing, when the place's Google details are under 30 days old.
  """
  enrichPlaceFromGoogle(input: EnrichPlaceInput, placeId: ID!): EnrichPlaceFromGoogleResult!

  """
  Find-or-create. Naturally idempotent on the primary key. Changing the `type` of a code that already has one is admin-only (§2.1: 'only on creation or admin').
  """
  ensureBarcode(code: String!, type: String): EnsureBarcodeResult!

  """Your invite link, made on first use. Idempotent."""
  ensureFriendInvite: EnsureFriendInviteResult!

  """
  The stored proposal, without re-running the model. A mutation only because §8.3 keeps the command vocabulary on `Mutation`; it writes nothing.
  """
  itemOnboardingDefaults(onboardingId: ID!): ItemOnboardingDefaultsResult!

  """
  Point an item at a code. The item's creator only — this is the write today's empty-filter `barcodes` update permission lets anybody make.
  """
  linkBarcodeItem(code: String!, itemId: ID!, itemType: ItemType!): LinkBarcodeItemResult!

  """
  The item creator's alone (today's `item_brands` insert check). `brandId` comes from `resolveBrand`, never from a client-invented id; one that names no brand is a `NotFoundError`.
  """
  linkItemBrand(brandId: ID!, isPrimary: Boolean, itemId: ID!, type: ItemType!): LinkItemBrandResult!

  """
  Idempotent on (place, brand): a repeat link with a different relationship updates it rather than conflicting.
  """
  linkPlaceBrand(input: LinkPlaceBrandInput!, placeId: ID!): LinkPlaceBrandResult!

  """
  Log a drink — with or without a bottle (X02). Your score here never changes your review of the item.
