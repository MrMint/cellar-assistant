# managed-by: cellar-assistant infra/nginx-proxy/vhost.d/files.conf
#
# Server-level config for PUBLIC_FILES_HOST (MinIO's S3 API) on the host's
# shared nginx-proxy. scripts/deploy/edge.sh installs it as
# `<vhost.d>/<PUBLIC_FILES_HOST>`; see edge.conf beside it for how the include
# works and what the first line is for.
#
# The whole host goes to minio:9000 (VIRTUAL_PORT on the `minio` service in
# infra/docker-compose.prod.yml, no VIRTUAL_PATH). Path-style, no prefix: every
# URL here is SigV4-presigned over the Host header AND the path
# (services/actors/src/lib/s3-presign.ts), so neither may change in flight.
# nginx-proxy sends `Host: $host$host_port`, which on 443 is the bare hostname
# the signer signed; and `proxy_pass` has no URI, so the path is forwarded as
# sent. A PUT through this file was measured passing signature verification:
# docs/architecture/deploy-loki.md §8.

# CORS IS THE OBJECT STORE'S, NOT NGINX'S. The browser's PUT is cross-origin
# with an image Content-Type, so a preflight `OPTIONS` precedes it, and the
# object store answers it (reflecting the origin). Nothing here may answer,
# rewrite or strip `OPTIONS` or the `Access-Control-*` headers — no
# `add_header Access-Control-…`, no `if ($request_method = OPTIONS)`. Measured
# with both MinIO and pgsty/silo behind the pinned nginx-proxy: the preflight's
# CORS headers were identical with and without the proxy.

# THE UPLOAD CAP. nginx's default is 1m, which would 413 every presigned image
# upload over a megabyte before MinIO saw it. MAX_UPLOAD_BYTES is 20 MiB
# (services/actors/src/lib/s3-presign.ts) and FileActor.verify refuses anything
# larger after the fact; 21m is that plus headroom, so this edge never refuses
# a legal upload and still bounds an illegal one — the edge cap Caddy's site
# block only described as a stopgap. Raise both together.
client_max_body_size 21m;

# Stream uploads and downloads instead of spooling them to nginx-proxy's disk:
# a 20 MiB PUT would otherwise be buffered whole (to a temp file, past
# client_body_buffer_size) before MinIO received its first byte, and a large GET
# likewise. MinIO's own nginx guide sets both.
proxy_request_buffering off;
proxy_buffering off;

# nginx's 60s defaults are per read/write, not per request, so they bound a
# stalled transfer rather than a slow one. 300s gives a slow phone upload room
# without leaving a dead connection open for long.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
