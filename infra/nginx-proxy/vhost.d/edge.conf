# managed-by: cellar-assistant infra/nginx-proxy/vhost.d/edge.conf
#
# Server-level config for PUBLIC_EDGE_HOST on the host's shared nginx-proxy.
# scripts/deploy/edge.sh installs this file as `<vhost.d>/<PUBLIC_EDGE_HOST>`;
# nginx-proxy's template includes `vhost.d/<hostname>` inside that host's
# `server {}` block (and only when the file exists at generation time — see
# edge.sh). The first line is the ownership marker edge.sh checks before it
# overwrites anything: a file at that path without it belongs to someone else.
#
# WHAT ROUTES WHERE IS NOT IN THIS FILE. It is in infra/docker-compose.prod.yml,
# as VIRTUAL_PATH on two containers, and nginx-proxy turns each into a
# `location`:
#
#   api     VIRTUAL_PATH="~ ^/(graphql|healthz)$"  -> location ~ ^/(graphql|healthz)$
#   actors  VIRTUAL_PATH="^~ /api/auth/"           -> location ^~ /api/auth/
#
# Neither container claims "/", so the template adds `location / { return 404; }`
# (DEFAULT_ROOT is unset on Loki, so its default, 404, applies). That 404 is
# what keeps `/`, `/actors/*`, `/dapr/*` and everything else off the edge —
# the job Caddy's fall-through `handle { respond 404 }` used to do.
# scripts/deploy/check-prod-config.mjs refuses a render in which either path
# changes or disappears: a container with no VIRTUAL_PATH is served at "/",
# which for the actor host would put every actor method on the internet behind
# one token.
#
# RAW PATHS REACH THE ACTOR HOST UNCHANGED. nginx-proxy's `proxy_pass` carries
# no URI (VIRTUAL_DEST is unset), so nginx forwards the request line exactly as
# the client sent it. nginx *matches* `location`s against the normalised path
# (dot segments resolved, %XX decoded, slashes merged), so a spelling such as
# `/actors/../api/auth/jwks` is matched to the actor host and forwarded raw —
# where `canonicalPathGate` (services/actors/src/lib/host-app.ts) answers 400
# before any route sees it. The opposite spelling, `/api/auth/../../actors/…`,
# normalises to `/actors/…` and is a 404 here. Both measured against the pinned
# nginx-proxy image: docs/architecture/deploy-loki.md §8.

# THE BODY CAP. 128 KiB is services/api's MAX_BODY_BYTES (src/limits.ts), which
# that process checks against Content-Length only — a declaration. nginx counts
# the bytes as they arrive, chunked bodies included, so this closes the
# chunked-upload bypass the same way Caddy's `request_body { max_size 128KiB }`
# did. Server level, so every location on this host — /api/auth/* included,
# which has no cap of its own — gets it by default. nginx's own default is 1m.
client_max_body_size 128k;
